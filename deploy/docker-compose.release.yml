services:
  specx:
    image: ${SPECX_IMAGE:?set SPECX_IMAGE to the published specX image}
    pull_policy: always
    ports:
      - "4224:4224"
    environment:
      SPECX_PASSWORD: ${SPECX_PASSWORD:?set SPECX_PASSWORD in the environment}
      SPECX_SESSION_SECRET: ${SPECX_SESSION_SECRET:?set SPECX_SESSION_SECRET in the environment}
      SPECX_PUBLIC_ORIGIN: ${SPECX_PUBLIC_ORIGIN:-http://localhost:4224}
      SPECX_DATABASE_URL: ${SPECX_DATABASE_URL:-}
      SPECX_DATABASE_MAX_POOL_SIZE: ${SPECX_DATABASE_MAX_POOL_SIZE:-16}
    volumes:
      - specx-data:/app/data
      - specx-backups:/app/backups
    restart: unless-stopped

volumes:
  specx-data:
  specx-backups:

[package]
name = "specx-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone specX web host"

[features]
default = ["postgres"]
postgres = ["specx-api/postgres"]
s3-backup = ["specx-api/s3-backup"]

[dependencies]
axum = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
specx-api = { path = "../specx-api", default-features = false }
specx-platform = { path = "../specx-platform" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }

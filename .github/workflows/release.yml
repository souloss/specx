name: Desktop release

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPECX_RELEASE_REPOSITORY: ${{ github.repository }}
  SPECX_BUILD_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag, version, bilingual notes and public key
        run: |
          node scripts/release.mjs check "$GITHUB_REF_NAME"
          node scripts/release.mjs config --required
          node scripts/release.mjs assets "$GITHUB_REF_NAME"
      - name: Create or reuse an unpublished draft
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) throw new Error('Published releases are immutable. Use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, name: `specX ${tag}`, draft: true, prerelease: false, body: fs.readFileSync('.local/release-assets/notes.md', 'utf8') })).data;
            }
            core.setOutput('id', release.id);

  desktop:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Configure signed updater
        run: node scripts/release.mjs config --required
      - name: Verify release tooling
        run: pnpm test:release
      - name: Verify frontend behavior
        run: pnpm --dir apps/desktop test
      - name: Build signed desktop artifacts into the draft
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config .local/tauri-update.conf.json -- --locked

      - name: Build and sign macOS updater artifact
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECX_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          SPECX_RELEASE_REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pnpm tauri build --target "${{ matrix.target }}" --config .local/tauri-update.conf.json --no-sign -- --locked
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          source_archive="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          updater_archive="$bundle_dir/macos/specX_${{ matrix.arch }}.app.tar.gz"
          cp "$source_archive" "$updater_archive"
          TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_PRIVATE_KEY" pnpm tauri signer sign "$updater_archive" --app-version "${GITHUB_REF_NAME#v}"
          dmg="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          upload_asset() {
            local path="$1"
            local name
            local asset_id
            name="$(basename "$path")"
            asset_id="$(gh api "repos/${SPECX_RELEASE_REPOSITORY}/releases/${SPECX_RELEASE_ID}/assets" --paginate --jq ".[] | select(.name == \"${name}\") | .id" | head -n 1)"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/${SPECX_RELEASE_REPOSITORY}/releases/${SPECX_RELEASE_ID}/assets/${asset_id}" >/dev/null
            fi
            gh api --hostname uploads.github.com --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              "repos/${SPECX_RELEASE_REPOSITORY}/releases/${SPECX_RELEASE_ID}/assets?name=${name}" \
              --input "$path" >/dev/null
          }
          upload_asset "$dmg"
          upload_asset "$updater_archive"
          upload_asset "$updater_archive.sig"

  publish:
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all platforms and upload bilingual changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release.mjs assets "$GITHUB_REF_NAME"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --pattern 'specX_aarch64.app.tar.gz' --pattern 'specX_aarch64.app.tar.gz.sig' --pattern 'specX_x64.app.tar.gz' --pattern 'specX_x64.app.tar.gz.sig' --dir .local/release-assets
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { mergeUpdaterPlatforms } from './scripts/release.mjs';
          const directory = '.local/release-assets';
          const manifest = JSON.parse(await readFile(`${directory}/latest.json`, 'utf8'));
          const platforms = {};
          for (const [key, name] of [['darwin-aarch64', 'specX_aarch64.app.tar.gz'], ['darwin-x86_64', 'specX_x64.app.tar.gz']]) {
            platforms[key] = { name, signature: await readFile(`${directory}/${name}.sig`, 'utf8') };
          }
          mergeUpdaterPlatforms(manifest, process.env.SPECX_RELEASE_REPOSITORY, platforms);
          await writeFile(`${directory}/latest.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          node scripts/release.mjs verify-manifest .local/release-assets/latest.json
          gh release upload "$GITHUB_REF_NAME" .local/release-assets/latest.json .local/release-assets/releases-zh-CN.json .local/release-assets/releases-en.json --clobber
      - name: Advance the production channel and publish the complete release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { assertReleaseAdvance } = await import(pathToFileURL(`${process.cwd()}/scripts/release.mjs`).href);
            const { owner, repo } = context.repo;
            let current;
            try { current = (await github.rest.repos.getLatestRelease({ owner, repo })).data.tag_name; }
            catch (error) { if (error.status !== 404) throw error; }
            assertReleaseAdvance(context.ref.replace('refs/tags/', ''), current);
            await github.rest.repos.updateRelease({ owner, repo, release_id: Number('${{ needs.prepare.outputs.release_id }}'), draft: false, make_latest: 'true', body: fs.readFileSync('.local/release-assets/notes.md', 'utf8') });

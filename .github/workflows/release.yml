name: Desktop release

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPECX_RELEASE_REPOSITORY: ${{ github.repository }}
  SPECX_BUILD_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag, version, bilingual notes and public key
        run: |
          node scripts/release.mjs check "$GITHUB_REF_NAME"
          node scripts/release.mjs config --required
          node scripts/release.mjs assets "$GITHUB_REF_NAME"
      - name: Create or reuse an unpublished draft
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) throw new Error('Published releases are immutable. Use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, name: `specX ${tag}`, draft: true, prerelease: false, body: fs.readFileSync('.local/release-assets/notes.md', 'utf8') })).data;
            }
            core.setOutput('id', release.id);

  desktop:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            tauri_args: --no-sign
          - os: macos-14
            target: x86_64-apple-darwin
            tauri_args: --no-sign
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Configure signed updater
        run: node scripts/release.mjs config --required
      - name: Verify release tooling
        run: pnpm test:release
      - name: Verify frontend behavior
        run: pnpm --dir apps/desktop test
      - name: Build signed desktop artifacts into the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config .local/tauri-update.conf.json ${{ matrix.tauri_args }} -- --locked

  publish:
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all platforms and upload bilingual changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release.mjs assets "$GITHUB_REF_NAME"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir .local/release-assets
          node scripts/release.mjs verify-manifest .local/release-assets/latest.json
          gh release upload "$GITHUB_REF_NAME" .local/release-assets/releases-zh-CN.json .local/release-assets/releases-en.json --clobber
      - name: Advance the production channel and publish the complete release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { assertReleaseAdvance } = await import(pathToFileURL(`${process.cwd()}/scripts/release.mjs`).href);
            const { owner, repo } = context.repo;
            let current;
            try { current = (await github.rest.repos.getLatestRelease({ owner, repo })).data.tag_name; }
            catch (error) { if (error.status !== 404) throw error; }
            assertReleaseAdvance(context.ref.replace('refs/tags/', ''), current);
            await github.rest.repos.updateRelease({ owner, repo, release_id: Number('${{ needs.prepare.outputs.release_id }}'), draft: false, make_latest: 'true', body: fs.readFileSync('.local/release-assets/notes.md', 'utf8') });

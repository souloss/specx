name: specX CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test:release
      - run: pnpm migration:check
      - run: pnpm --dir apps/desktop format:check
      - run: pnpm --dir apps/desktop check:dev-styles
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy -p specx-core -p specx-api -p specx-web --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: pnpm build:checked
      - run: pnpm test:specx
